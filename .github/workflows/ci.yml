name: Integración

# Compila la API y el front, y al entrar a `main` publica las imágenes en GHCR
# etiquetadas con el SHA del commit. Ese SHA es la bisagra con `deploy.yml`,
# que no construye nada: busca la imagen de un commit que ya pasó por aquí.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Compilar
        working-directory: Back
        # La única prueba levanta el contexto completo y pide Postgres.
        run: mvn -B -DskipTests package

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Front/package-lock.json
      - name: Instalar
        working-directory: Front
        run: npm ci
      - name: Compilar
        working-directory: Front
        env:
          VITE_API_URL: ""
        run: npm run build
      - name: El bundle no apunta a localhost
        working-directory: Front
        run: |
          if grep -rq "localhost:8080" dist; then
            echo "El build quedó apuntando a localhost:8080 (VITE_API_URL sin definir)."
            exit 1
          fi

  imagenes:
    name: Publicar imágenes
    runs-on: ubuntu-latest
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      # GHCR solo acepta minúsculas y el dueño del repo es `ALGarciaY`.
      - name: Nombre de imagen en minúsculas
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API
        uses: docker/build-push-action@v5
        with:
          context: ./Back
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}/api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO }}/api:main
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web
        uses: docker/build-push-action@v5
        with:
          context: ./Front
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}/web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO }}/web:main
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
