# Zona para limitar intentos de login por IP (se declara en el contexto http,
# que es donde carga conf.d).
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;
    charset     utf-8;

    # Los materiales se suben por aquí (Spring acepta hasta 60 MB por petición).
    client_max_body_size 60m;

    # BFF: el front y la API comparten origen. La API no publica puertos ni
    # está en la red del proxy; solo este nginx la alcanza, por la red interna.
    # Swagger (/swagger-ui, /v3/api-docs) NO se reenvía: queda fuera de internet.
    # Fuerza bruta de documentos: 5 intentos por minuto y por IP en el login.
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass         http://corpforms-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        proxy_pass         http://corpforms-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # El https lo termina Caddy: se pasa el esquema que él vio, no el http
        # de este salto. Spring lo usa para saber que la petición es del mismo
        # origen (si no, trata los POST del navegador como CORS y los rechaza).
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    # Archivos subidos que Spring sirve como estáticos. Solo las imágenes se
    # muestran en línea; cualquier otro tipo se descarga y no puede ejecutar
    # scripts en este origen (sandbox + CSP). Hay que repetir las cabeceras de
    # seguridad aquí: un add_header en una location anula las del servidor.
    location ~* ^/uploads/.+\.(jpg|jpeg|png|webp)$ {
        proxy_pass         http://corpforms-api:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    location /uploads/ {
        proxy_pass         http://corpforms-api:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # Los assets llevan hash en el nombre: se pueden cachear sin miedo.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    gzip            on;
    gzip_types      text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "no-referrer" always;
}
