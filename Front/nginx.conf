server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;
    charset     utf-8;

    # Los materiales se suben por aquí (Spring acepta hasta 60 MB por petición).
    client_max_body_size 60m;

    # BFF: el front y la API comparten origen. La API no publica puertos ni
    # está en la red del proxy; solo este nginx la alcanza, por la red interna.
    # Swagger (/swagger-ui, /v3/api-docs) NO se reenvía: queda fuera de internet.
    location /api/ {
        proxy_pass         http://corpforms-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # El https lo termina Caddy: se pasa el esquema que él vio, no el http
        # de este salto. Spring lo usa para saber que la petición es del mismo
        # origen (si no, trata los POST del navegador como CORS y los rechaza).
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    # Archivos subidos que Spring sirve como estáticos.
    location /uploads/ {
        proxy_pass         http://corpforms-api:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Los assets llevan hash en el nombre: se pueden cachear sin miedo.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    gzip            on;
    gzip_types      text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "no-referrer" always;
}
